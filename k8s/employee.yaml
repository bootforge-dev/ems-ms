apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-service
  namespace: microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employee-service
  template:
    metadata:
      labels:
        app: employee-service
    spec:
      containers:
        - name: employee-service
          image: <AWS_ACCOUNT_ID>.dkr.ecr.ap-south-2.amazonaws.com/employee-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: DEPARTMENT_SERVICE_URL
              value: http://department-service:8082
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: 500m, memory: 768Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: employee-service
  namespace: microservices
spec:
  type: LoadBalancer      # public entry point for the demo
  selector:
    app: employee-service
  ports:
    - port: 80
      targetPort: 8081
